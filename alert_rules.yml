# Balanced production environment alerting rules
groups:
  - name: host_alerts
    rules:
      - alert: HostHighCPUUsage
        # TRIGGER: Fires only if total host CPU utilization exceeds 85%
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        # TIME THRESHOLD: Must remain high for 5 consecutive minutes to avoid false positives
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "🚨 High CPU utilization detected on the host machine"
          description: "The system CPU load has sustained levels above 85% for more than 5 minutes. Please investigate top resource-consuming processes."



