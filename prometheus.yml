# Global configuration settings that apply universally across all scraping operations
global:
  # Defines how frequently Prometheus will pull (scrape) data from targeted endpoints (default is 1m)
  scrape_interval: 15s

# ALERTING CONFIGURATION: Tells Prometheus where to forward active triggers
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            # Connects directly to the Alertmanager container using Docker's internal DNS on port 9093
            - 'alertmanager:9093'

# RULE FILES: Instructs Prometheus to load warning parameters and alert logic files
rule_files:
  - "alert_rules.yml"

# Contains all target configurations directing Prometheus where to collect performance metrics from
scrape_configs:
  # --------------------------------------------------------------------------------------
  # Job 1: Prometheus Internal Monitoring
  # --------------------------------------------------------------------------------------
  - job_name: 'prometheus'
    # Static configuration allows manual entry of fixed network target endpoints
    static_configs:
      # Localhost works here because port 9090 is internal and running within this same container context
      - targets: ['localhost:9090']

  # --------------------------------------------------------------------------------------
  # Job 2: Host Hardware and OS Performance Monitoring
  # --------------------------------------------------------------------------------------
  - job_name: 'node-exporter'
    # Static configuration allows manual entry of fixed network target endpoints
    static_configs:
      # RELIABLE INTERNAL DOCKER ROUTING: Uses the service name 'node-exporter' as a direct hostname.
      # Docker's internal DNS automatically resolves this to the correct isolated container IP address.
      - targets: ['node-exporter:9100']

  # --------------------------------------------------------------------------------------
  # Job 3: Custom Python Application Metrics Scraper (Password API Component)
  # --------------------------------------------------------------------------------------
  - job_name: 'password-api'
    # Static configuration allows manual entry of fixed network target endpoints
    static_configs:
      # INTERNAL SERVICE ROUTING: Points directly to the container service name 'password-api' on port 5000.
      # This enables Prometheus to isolate and scrape the custom application metrics exported via the '/metrics' path.
      - targets: ['password-api:5000']
